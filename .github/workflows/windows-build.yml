name: Windows build, tests and offline installer

on:
  push:
    branches: [master, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Restore camera libraries
        run: nuget restore PhotoAgent/packages.config -PackagesDirectory packages -NonInteractive
      - name: Build .NET Framework 4.8 application
        run: msbuild PhotoAgent/PhotoAgent.csproj /p:Configuration=Release /p:SignManifests=false /p:GenerateManifests=false /verbosity:minimal
      - name: Exercise file command handling
        shell: powershell
        run: ./tests/Run-CommandTests.ps1
      - name: Exercise missing-camera windows and reconnection
        timeout-minutes: 3
        shell: powershell
        run: ./tests/Run-CameraTests.ps1
      - name: Build full offline installer
        timeout-minutes: 6
        shell: powershell
        run: ./installer/Build-Installer.ps1
      - name: Exercise installation, upgrade and removal
        timeout-minutes: 4
        shell: powershell
        run: ./tests/Run-InstallerTests.ps1
      - name: Upload full offline installation package
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAgent-Full-Setup
          path: installer/output/
          compression-level: 0
          if-no-files-found: error
      - name: Upload installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAgent-Installer-Logs
          path: tests/bin/installer-*.log
          if-no-files-found: ignore
      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAgent-Windows-Release
          path: PhotoAgent/bin/Release/
